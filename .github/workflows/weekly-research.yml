name: weekly-product-research

on:
  schedule:
    # Mondays at 15:17 UTC (8:17am Pacific during daylight time, 7:17am in winter)
    - cron: "17 15 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The agent SDK drives the Claude Code CLI under the hood.
      - name: Install dependencies
        run: |
          npm install -g @anthropic-ai/claude-code
          pip install -r requirements.txt

      # Runs on your Claude subscription (token from `claude setup-token`).
      # To pay per use with an API key instead, replace this env line with
      # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Checks the token's shape without printing it, and saves the agent's
      # output to results/last_run.log so failures can be read from the repo.
      - name: Run research agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p results
          # Tokens copied from a terminal often pick up spaces or line breaks.
          CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')"
          export CLAUDE_CODE_OAUTH_TOKEN
          {
            echo "Run started $(date -u)"
            if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
              echo "TOKEN CHECK: secret CLAUDE_CODE_OAUTH_TOKEN is empty or missing"
            else
              echo "TOKEN CHECK: length ${#CLAUDE_CODE_OAUTH_TOKEN}"
              case "$CLAUDE_CODE_OAUTH_TOKEN" in
                sk-ant-oat01-*) echo "TOKEN CHECK: prefix ok" ;;
                *) echo "TOKEN CHECK: does not start with sk-ant-oat01-" ;;
              esac
              if printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | grep -q '[[:space:]]'; then
                echo "TOKEN CHECK: contains a space or line break"
              else
                echo "TOKEN CHECK: no whitespace"
              fi
            fi
          } | tee results/last_run.log
          python agent.py 2>&1 | tee -a results/last_run.log

      - name: Score and post report
        run: python score.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Save results to the repo
        if: always()
        run: |
          git config user.name "research-bot"
          git config user.email "research-bot@users.noreply.github.com"
          git add results/
          git commit -m "Weekly research $(date +%F)" || echo "Nothing to commit"
          git push
